<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f35"><title>Sports collectifs · Vauban</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><script defer src="core.js"></script><script defer src="app.js"></script></head><body>
<header><div><span class="eyebrow">VAUBAN · EPS</span><h1>Sports collectifs</h1><p>Des équipes, des observations, des progrès.</p></div><div class="header-right"><span class="version">v1.12</span><button data-action="fullscreen" aria-label="Afficher en plein écran" class="round">⤢</button></div></header>
<main><div class="topbar"><label>Classe<select id="classSelect" aria-label="Classe"></select></label><label>Séance<select id="sessionSelect" aria-label="Séance"></select></label><label>Activité<input id="sportSelect" type="text" maxlength="100" placeholder="Écris ton activité…" aria-label="Activité de la séance"></label><button data-action="class-dialog">Classes et élèves</button><button data-action="new-session">＋ Nouvelle séance</button><button data-action="delete-class" class="danger">Supprimer cette classe</button><button data-action="help">ⓘ Aide</button></div>
<section id="sessionClock" class="card session-clock" hidden></section><nav id="nav" aria-label="Vues de la séance"></nav><div id="content"></div><footer><span id="saved" role="status">Sauvegarde sur cet appareil</span><div><button data-action="export">Exporter la sauvegarde</button><button data-action="import">Importer</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></footer></main>
<dialog id="dialog"><form id="dialogForm"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" data-action="close-dialog" aria-label="Fermer">✕</button></div><div id="dialogBody"></div><div id="dialogActions" class="actions"></div></form></dialog><div id="notice" role="status" hidden></div>
</body></html>
